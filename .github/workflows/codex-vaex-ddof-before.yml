name: Vaex exact-source ddof native before 73
on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-vaex-ddof-native73]
permissions:
  contents: read
jobs:
  native-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vaexio/vaex
          ref: 0780e9ca0ed1539f9754c3d186035c1372ff32f0
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: ''
      - name: Freeze diagnostic packet and authenticate complete source
        shell: bash
        run: |
          set -euo pipefail
          export VAEX73_OUTPUT="$RUNNER_TEMP/vaex73"
          export VAEX73_SOURCE="$GITHUB_WORKSPACE/source"
          mkdir -p "$VAEX73_OUTPUT/packet" "$VAEX73_OUTPUT/tmp" "$VAEX73_OUTPUT/wheels"
          python - <<'PYASSETS'
          import base64,hashlib,json,os,shutil,zlib
          from pathlib import Path
          root=Path(os.environ['VAEX73_OUTPUT'])
          assert shutil.disk_usage(root).free >= 10*1024**3, 'Less than10GiB free on standard runner'
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          for name,text in assets.items():
              path=root/'packet'/name
              path.write_text(text)
              path.chmod(0o444)
          manifest=json.loads(assets['packet-manifest.json'])
          for name,digest in manifest.items():
              assert hashlib.sha256((root/'packet'/name).read_bytes()).hexdigest()==digest
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('VAEX73_OUTPUT='+str(root)+'\nVAEX73_SOURCE='+os.environ['VAEX73_SOURCE']+'\nTMPDIR='+str(root/'tmp')+'\n')
          print('VAEX73_PACKET '+json.dumps(manifest),flush=True)
          PYASSETS
          python "$VAEX73_OUTPUT/packet/guard.py" before
      - name: Install official native build requirements without project metadata changes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3-dev
          g++ --version
          python -m venv "$VAEX73_OUTPUT/venv"
          "$VAEX73_OUTPUT/venv/bin/python" -m pip install --no-cache-dir --progress-bar off --only-binary=:all: numpy==2.0.2 setuptools wheel scikit-build cmake ninja
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard.py" after-build-deps
      - name: One bounded whole exact-source native core wheel build
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/bounded-build.py"
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard.py" after-build
      - name: Install only the newly built local core wheel with official runtime requirements
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -m pip install --no-cache-dir --progress-bar off numpy==2.0.2 "$VAEX73_OUTPUT"/wheels/vaex_core-*.whl
          "$VAEX73_OUTPUT/venv/bin/python" -m pip check
          "$VAEX73_OUTPUT/venv/bin/python" -m pip freeze > "$VAEX73_OUTPUT/runtime-freeze.txt"
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard.py" before-fixture
      - name: Execute isolated fixture process and freeze raw report plus original exit
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/run-and-freeze.py"
          cat "$VAEX73_OUTPUT/fixture.log"
          if [ -f "$VAEX73_OUTPUT/raw-report.json" ]; then
            echo VAEX73_RAW_REPORT_BEGIN
            cat "$VAEX73_OUTPUT/raw-report.json"
            echo
            echo VAEX73_RAW_REPORT_END
          fi
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard.py" after-fixture
      - name: Assess already frozen native observations independently
        if: steps.fixture.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/assess.py"
      - name: Final complete source and index guard
        if: always()
        shell: bash
        run: python "$RUNNER_TEMP/vaex73/packet/guard.py" final
      - name: Print bounded native build and frozen proof without uploads
        if: always()
        shell: bash
        run: |
          python - <<'PYPROOF'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'vaex73'
          for name in ['native-build.log','build-exit.json','fixture-exit.json','frozen.json','runtime-freeze.txt']:
              f=p/name
              if f.is_file():
                  b=f.read_bytes()
                  print('VAEX73_PROOF_FILE '+json.dumps({'name':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}),flush=True)
                  if len(b)<=11*1024*1024:
                      print(b.decode(errors='replace'),flush=True)
                  else:
                      raise AssertionError('Proof exceeds bounded native log allowance')
          PYPROOF
