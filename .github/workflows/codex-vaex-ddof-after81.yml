name: Vaex whole-source ddof candidate81
on:
  workflow_dispatch:
  push:
    branches: [codex/validate-vaex-ddof-after81]
permissions:
  contents: read
jobs:
  native-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vaexio/vaex
          ref: 0780e9ca0ed1539f9754c3d186035c1372ff32f0
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: ''
      - name: Authenticate original whole source and apply sealed candidate
        shell: bash
        run: |
          set -euo pipefail
          export VAEX73_OUTPUT="$RUNNER_TEMP/vaex81"
          export VAEX73_SOURCE="$GITHUB_WORKSPACE/source"
          mkdir -p "$VAEX73_OUTPUT/packet" "$VAEX73_OUTPUT/tmp" "$VAEX73_OUTPUT/wheels"
          python - <<'PYASSETS'
          import base64,hashlib,json,os,shutil,zlib
          from pathlib import Path
          root=Path(os.environ['VAEX73_OUTPUT'])
          assert shutil.disk_usage(root).free >= 10*1024**3
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          for name,data in assets.items():
              (root/'packet'/name).write_text(data)
          manifest=json.loads(assets['native-payload-manifest.json'])
          for name,digest in manifest.items():
              assert hashlib.sha256((root/'packet'/name).read_bytes()).hexdigest()==digest
              (root/'packet'/name).chmod(0o444)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('VAEX73_OUTPUT='+str(root)+'\nVAEX73_SOURCE='+os.environ['VAEX73_SOURCE']+'\nTMPDIR='+str(root/'tmp')+'\n')
          print('VAEX81_PACKET '+json.dumps(manifest),flush=True)
          PYASSETS
          python "$VAEX73_OUTPUT/packet/guard81.py" prepare
      - name: Install unchanged official native build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3-dev
          g++ --version
          python -m venv "$VAEX73_OUTPUT/venv"
          "$VAEX73_OUTPUT/venv/bin/python" -m pip install --no-cache-dir --progress-bar off --only-binary=:all: numpy==2.0.2 setuptools wheel scikit-build cmake ninja
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard81.py" after-build-deps
      - name: One bounded whole-source native core wheel build
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/bounded-build.py"
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard81.py" after-build
      - name: Install only newly built core wheel and official runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -m pip install --no-cache-dir --progress-bar off numpy==2.0.2 "$VAEX73_OUTPUT"/wheels/vaex_core-*.whl
          "$VAEX73_OUTPUT/venv/bin/python" -m pip check
          "$VAEX73_OUTPUT/venv/bin/python" -m pip freeze > "$VAEX73_OUTPUT/core-runtime-freeze.txt"
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard81.py" before-public
      - name: Freeze original public assertions with explicit after-source binding
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/native-run81.py" public
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard81.py" after-public
      - name: Install source sibling packages required by upstream test fixtures
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -m pip install --no-cache-dir --progress-bar off numpy==2.0.2 pytest pytest-asyncio pytest-timeout scipy xarray requests diskcache psutil fsspec graphviz "$VAEX73_SOURCE/packages/vaex-server" "$VAEX73_SOURCE/packages/vaex-hdf5"
          "$VAEX73_OUTPUT/venv/bin/python" -m pip check
          "$VAEX73_OUTPUT/venv/bin/python" -m pip freeze > "$VAEX73_OUTPUT/test-runtime-freeze.txt"
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/runtime-guard81.py"
      - name: Freeze all permanent ddof regression results
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/native-run81.py" regressions
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard81.py" after-regressions
      - name: Freeze explicitly selected local aggregate and groupby suite
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/native-run81.py" upstream
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard81.py" after-upstream
      - name: Freeze the same explicitly selected local suite with result cache enabled
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/native-run81.py" upstream-cache
          "$VAEX73_OUTPUT/venv/bin/python" "$VAEX73_OUTPUT/packet/guard81.py" after-upstream-cache
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/runtime-guard81.py"
      - name: Print bounded raw build evidence and dependency resolutions
        if: always()
        shell: bash
        run: |
          python - <<'PYRAW'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'vaex81'
          for name in ['build-exit.json','core-runtime-freeze.txt','test-runtime-freeze.txt']:
              path=root/name
              if path.is_file():
                  assert path.stat().st_size <= 160*1024
                  print('VAEX81_RAW_BUILD '+name+' '+path.read_text(),flush=True)
          log=root/'native-build.log'
          if log.is_file():
              data=log.read_bytes()
              print('VAEX81_RAW_BUILD_LOG bytes='+str(len(data))+' tail_bytes='+str(min(len(data),160*1024)),flush=True)
              print(data[-160*1024:].decode(errors='replace'),flush=True)
          PYRAW
      - name: Assess already frozen native raw evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VAEX73_OUTPUT/venv/bin/python" -I "$VAEX73_OUTPUT/packet/native-assess81.py"
      - name: Final whole-source byte and pinned-vendor guard
        if: always()
        shell: bash
        run: python "$RUNNER_TEMP/vaex81/packet/guard81.py" final
